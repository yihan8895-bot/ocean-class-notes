  <text x="70" y="624" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#6b818a">范围：18.125–22.125°N、112.125–118.125°E · 阴影表示各日历月内的逐日变率。</text>
</svg>
